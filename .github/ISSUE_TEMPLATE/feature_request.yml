name: 💡 建议与意见
description: 提交新功能建议、体验改进或其他意见
title: "[Feature] "
labels:

* enhancement
  body:

* type: textarea
  id: suggestion
  attributes:
  label: 建议内容
  description: 请简要描述你的建议或希望增加的功能。
  placeholder: 例如：希望支持更多直播平台
  validations:
  required: true

* type: textarea
  id: scenario
  attributes:
  label: 使用场景
  description: 请描述这个功能会在什么场景下使用，以及目前遇到了什么问题。
  placeholder: 请描述具体的使用场景
  validations:
  required: true

* type: textarea
  id: solution
  attributes:
  label: 期望方案
  description: 请描述你希望 Live Recorder 如何实现或表现。如果有具体的交互、流程或配置方式，也可以一起说明。
  placeholder: 请描述你期望的实现方式
  validations:
  required: true

* type: textarea
  id: alternatives
  attributes:
  label: 可选方案
  description: 如果你了解其他可行的实现方式或替代方案，可以在这里补充。
  validations:
  required: false

* type: textarea
  id: additional
  attributes:
  label: 补充信息
  description: 其他想法或说明。
  validations:
  required: false
