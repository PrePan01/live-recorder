name: Release desktop apps

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release (leave disabled for validation builds)
        type: boolean
        default: false
      resume_version:
        description: Resume an existing frozen release without rebuilding (for example 1.2.5)
        type: string
        default: ''

concurrency:
  group: release-branch
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      reuse_release: ${{ steps.release.outputs.reuse_release }}
      reuse_checks: ${{ steps.release.outputs.reuse_checks }}
      source_commit: ${{ steps.release.outputs.source_commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Validate version and release state
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
          RESUME_VERSION: ${{ inputs.resume_version }}
        run: |
          if [ "$PUBLISH_RELEASE" = "true" ] && [ "$GITHUB_REF" != "refs/heads/release" ]; then
            echo "::error::Official publication is only allowed from the release branch."
            exit 1
          fi
          if [ -n "$RESUME_VERSION" ]; then
            if [ "$PUBLISH_RELEASE" != "true" ]; then
              echo "::error::Resuming requires publish=true."
              exit 1
            fi
            node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { ReleaseRemote } from './scripts/release-pipeline.mjs';
          const version = process.env.RESUME_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid resume version');
          const remote = new ReleaseRemote('release-assets', version);
          try {
            const release = remote.release();
            const journal = remote.readAsset('release-state.json');
            if (!journal) throw new Error('Resume requires a frozen release journal');
            const saved = JSON.parse(journal);
            if (saved.version !== version || !/^[a-f0-9]{40}$/.test(saved.commit))
              throw new Error('Invalid frozen release identity');
            remote.assertTag(saved.commit);
            if (!Object.keys(saved.files).length || !Object.keys(saved.files).every(name => release.assets.some(asset => asset.name === name)))
              throw new Error('Frozen assets are incomplete; resume cannot rebuild them');
            if (!remote.canReuseChecks(saved, saved.commit))
              throw new Error('Original release quality and native checks must have passed');
            console.log(`version=${version}\ntag=v${version}\nsource_commit=${saved.commit}\nshould_release=true\nreuse_release=true\nreuse_checks=true`);
          } finally { remote.close(); }
          NODE
            exit 0
          fi
          echo "source_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          version="$(node scripts/check-release-version.mjs)"
          tag="v${version}"
          # Fail before the expensive platform builds when this release has no
          # corresponding entry in the update manifest's release notes.
          node scripts/check-release-notes.mjs "$version" release-notes.json
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if [ "$PUBLISH_RELEASE" != "true" ]; then
            echo "Validation build only; skip tag and release checks."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "reuse_release=false" >> "$GITHUB_OUTPUT"
            echo "reuse_checks=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          node scripts/release-pipeline.mjs preflight release-assets "$version" >> "$GITHUB_OUTPUT"

  # Run repository-wide checks once on Linux. The platform build jobs below
  # should spend their time on platform-specific packaging rather than
  # repeating the same backend/frontend test suite on macOS and Windows.
  quality:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.reuse_checks != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_prefer_offline: 'true'
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '1000'
      npm_config_fetch_retry_maxtimeout: '10000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Verify repository quality
        run: node scripts/check-quality.mjs

  build:
    # Run platform packaging in parallel with the Linux quality gate. The
    # release job still waits for both, so a quality failure can never publish.
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.reuse_release != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: live-recorder-macos-${{ needs.prepare.outputs.version }}
            files: |
              release/*.dmg
              release/*.dmg.sig
          - os: windows-latest
            artifact: live-recorder-windows-${{ needs.prepare.outputs.version }}
            files: |
              release/*-setup.exe
              release/*.sig
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read

    env:
      npm_config_audit: 'false'
      npm_config_fund: 'false'
      npm_config_prefer_offline: 'true'
      npm_config_fetch_retries: '5'
      npm_config_fetch_retry_mintimeout: '1000'
      npm_config_fetch_retry_maxtimeout: '10000'
      # updater 签名：tauri.windows.conf.json 开启了 createUpdaterArtifacts，
      # 缺少私钥时 Windows 打包会直接失败（而不是产出没有 .sig 的安装包）。
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      # setup-node 只缓存 npm 的下载包；这里缓存已安装依赖，命中时可跳过平台打包任务中的 npm ci。
      # key 包含 OS、Node 主版本和三份 lockfile，避免原生依赖（如 keytar）跨平台或跨依赖树复用。
      - name: Restore installed dependencies
        id: node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'backend/package-lock.json', 'frontend/package-lock.json') }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          cache-on-failure: true

      - name: Install dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm run install:ci

      - name: Compile backend
        run: npm --prefix backend run build

      # package.mjs 随后会 prune backend/node_modules；必须在裁剪前保存完整依赖，
      # 否则下一次命中缓存时会缺少 vitest/typescript 等测试依赖。
      - name: Save installed dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            backend/node_modules
            frontend/node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json', 'backend/package-lock.json', 'frontend/package-lock.json') }}

      - name: Build installer
        env:
          # The Linux quality gate covers the shared test suite; this job only
          # needs the backend compiled for the platform-specific package.
          LR_SKIP_BACKEND_BUILD: '1'
          LR_SKIP_BACKEND_RESTORE: '1'
          LR_REQUIRE_SIGNATURE: '1'
        run: npm run package

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          # DMG/MSI files are already compressed.
          compression-level: 0

  native-test:
    # Native checks are independent of the Linux JS test suite and can run in
    # parallel with it to keep release wall-clock time down.
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true' && needs.prepare.outputs.reuse_checks != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Lifecycle tests launch their own Node fixture; no installer resources needed.
      TAURI_CONFIG: '{"bundle":{"resources":null}}'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust tests
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
          cache-on-failure: true

      - name: Verify native service lifecycle
        run: cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --lib

  release:
    needs: [prepare, quality, build, native-test]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/release' &&
          needs.prepare.result == 'success' &&
          (needs.quality.result == 'success' ||
           (needs.prepare.outputs.reuse_checks == 'true' && needs.quality.result == 'skipped')) &&
          (needs.native-test.result == 'success' ||
           (needs.prepare.outputs.reuse_checks == 'true' && needs.native-test.result == 'skipped')) &&
          (needs.build.result == 'success' ||
           (needs.prepare.outputs.reuse_release == 'true' && needs.build.result == 'skipped')) &&
          needs.prepare.outputs.should_release == 'true' &&
          (github.event_name == 'push' || inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      # Artifacts retain their original source identity; upload tooling may be newer.
      RELEASE_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      RELEASE_PIPELINE: ${{ inputs.resume_version != '' && 'release-tools/scripts/release-pipeline.mjs' || 'scripts/release-pipeline.mjs' }}
      # 对象存储加速（#28）：清单内安装包 URL 指向 CDN 域名（HTTPS，匿名可读）；
      # 客户端安装前核验完整 SHA256 和更新签名；CDN 不可达时回退 GitHub。
      UPDATE_BASE_URL: https://cdn.live-rec.bspartner.top
      QINIU_AK: ${{ secrets.QINIU_AK }}
      QINIU_SK: ${{ secrets.QINIU_SK }}
      QINIU_BUCKET: ${{ secrets.QINIU_BUCKET || 'live-recorder' }}
      QINIU_ENDPOINT: ${{ secrets.QINIU_ENDPOINT || 'https://s3.cn-south-1.qiniucs.com' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Check out current upload tooling for recovery
        if: inputs.resume_version != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      # Re-read here: a failed-job rerun may retain prepare outputs from before
      # publication. Do not restore/upload large installers merely to fix CDN.
      - name: Inspect current publication state
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node "$RELEASE_PIPELINE" status release-assets "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore frozen release assets
        if: needs.prepare.outputs.reuse_release == 'true' || steps.publication.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          ALREADY_PUBLISHED: ${{ steps.publication.outputs.published }}
        shell: bash
        run: |
          if [ "$ALREADY_PUBLISHED" = "true" ]; then
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets --pattern latest.json --pattern releases.json --pattern release-state.json
          else
            gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          fi

      - name: Download installers
        if: needs.prepare.outputs.reuse_release != 'true' && steps.publication.outputs.published != 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: live-recorder-*-${{ needs.prepare.outputs.version }}
          path: release-assets
          merge-multiple: true

      # GitHub converts spaces in release-asset filenames to dots on upload.
      # Normalize the staging names first, so latest.json records the exact
      # public URL that will be served by the release.
      - name: Normalize release asset names
        if: needs.prepare.outputs.reuse_release != 'true' && steps.publication.outputs.published != 'true'
        shell: bash
        run: |
          shopt -s nullglob
          for asset in release-assets/*; do
            name="${asset##*/}"
            normalized="${name// /.}"
            if [ "$name" != "$normalized" ]; then
              mv -- "$asset" "release-assets/$normalized"
            fi
          done

      # GitHub publication is the formal release commit point.
      - name: Verify staged assets and publish GitHub Release
        if: steps.publication.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PREPARE_RELEASE_ASSETS: ${{ needs.prepare.outputs.reuse_release != 'true' }}
          AWS_ACCESS_KEY_ID: ${{ env.QINIU_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ env.QINIU_SK }}
          AWS_DEFAULT_REGION: cn-south-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: node "$RELEASE_PIPELINE" publish release-assets "$RELEASE_VERSION"

      # This phase may fail after publication. Reruns restore only three small
      # frozen manifests and skip builds, tests, hashing and installer uploads.
      - name: Synchronize CDN version indexes (release is already published)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          AWS_ACCESS_KEY_ID: ${{ env.QINIU_AK }}
          AWS_SECRET_ACCESS_KEY: ${{ env.QINIU_SK }}
          AWS_DEFAULT_REGION: cn-south-1
          AWS_EC2_METADATA_DISABLED: 'true'
        run: node "$RELEASE_PIPELINE" sync release-assets "$RELEASE_VERSION"
